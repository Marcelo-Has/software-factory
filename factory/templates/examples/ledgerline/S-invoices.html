<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices — Ledgerline</title>
<style>
  :root {
    --surface: #ffffff;
    --foreground: #16181d;
    --accent: #2563eb;
    --destructive: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --border: #e5e7eb;
    --focus: #2563eb;
    --spacing-base: 8px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --type-ratio: 1.25;
    --motion-duration-base: 150ms;
    --motion-curve-base: ease-out;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--foreground);
    font-family: system-ui, sans-serif;
    font-size: 16px;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--spacing-base) * 3) calc(var(--spacing-base) * 4);
    border-bottom: 1px solid var(--border);
  }

  h1 { font-size: 1.5rem; margin: 0; }

  .primary-action {
    background: var(--accent);
    color: var(--surface);
    border: none;
    border-radius: var(--radius-sm);
    padding: calc(var(--spacing-base) * 1.25) calc(var(--spacing-base) * 2);
    font-size: 0.9375rem;
    cursor: pointer;
  }

  .toolbar {
    display: flex;
    gap: var(--spacing-base);
    padding: calc(var(--spacing-base) * 2) calc(var(--spacing-base) * 4);
  }

  .filter {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: calc(var(--spacing-base) * 1) calc(var(--spacing-base) * 1.5);
    background: var(--surface);
    color: var(--foreground);
    font-size: 0.875rem;
  }

  .filter[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 calc(var(--spacing-base) * 4);
    width: calc(100% - var(--spacing-base) * 8);
  }

  th, td {
    text-align: left;
    padding: calc(var(--spacing-base) * 1.5);
    border-bottom: 1px solid var(--border);
    font-size: 0.9375rem;
  }

  th {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
  }

  td.amount, th.amount {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--spacing-base) * 0.5);
    padding: calc(var(--spacing-base) * 0.375) calc(var(--spacing-base) * 1);
    border-radius: var(--radius-full);
    font-size: 0.8125rem;
  }

  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: var(--radius-full);
  }

  .status--draft { background: #f3f4f6; color: #4b5563; }
  .status--draft::before { background: #9ca3af; }

  .status--sent { background: #eff6ff; color: #1d4ed8; }
  .status--sent::before { background: var(--accent); }

  .status--paid { background: #f0fdf4; color: #15803d; }
  .status--paid::before { background: var(--success); }

  .status--overdue { background: #fef2f2; color: #b91c1c; }
  .status--overdue::before { background: var(--destructive); }
</style>
</head>
<body>
  <header>
    <h1>Invoices</h1>
    <button class="primary-action" type="button">New invoice</button>
  </header>

  <div class="toolbar" role="group" aria-label="Filter by status">
    <button class="filter" type="button" aria-pressed="true">All</button>
    <button class="filter" type="button" aria-pressed="false">Draft</button>
    <button class="filter" type="button" aria-pressed="false">Sent</button>
    <button class="filter" type="button" aria-pressed="false">Paid</button>
    <button class="filter" type="button" aria-pressed="false">Overdue</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>Due date</th>
        <th class="amount">Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alder &amp; Finch Studio</td>
        <td>2026-08-30</td>
        <td class="amount">$1,240.00</td>
        <td><span class="status status--sent">Sent</span></td>
      </tr>
      <tr>
        <td>Marchetti Consulting</td>
        <td>2026-08-10</td>
        <td class="amount">$860.00</td>
        <td><span class="status status--overdue">Overdue</span></td>
      </tr>
      <tr>
        <td>Northlane Cooperative</td>
        <td>2026-07-28</td>
        <td class="amount">$2,010.50</td>
        <td><span class="status status--paid">Paid</span></td>
      </tr>
      <tr>
        <td>Pine &amp; Co.</td>
        <td>2026-09-05</td>
        <td class="amount">$430.00</td>
        <td><span class="status status--draft">Draft</span></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
