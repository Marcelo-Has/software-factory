# definition-status.yaml — Ledgerline
#
# Example artifact for factory/templates/definition-status-template.yaml. See the note in
# factory/templates/examples/ledgerline/PRODUCT.md — never copy this content into a real
# product's definition-status.yaml. Filled to `approved` for every stage, illustrating what a
# fully owner-approved Definition Phase looks like in this schema.
#
# Honesty note (kept here rather than silently dropped): this example intentionally stops
# short of full mechanical coverage — D4's DESIGN.md/tokens.css/DESIGN-DIGEST.md were never
# built for it (out of this session's scope; the two mockups below use an illustrative inline
# token block instead of values copied from a real tokens.css), and D5 carries mockups for
# only one of the five screens (S-invoices, both its `default` and `empty` states). A status
# of `approved` here reflects the owner's sign-off on this artifact-example's intentionally
# small scope, not 100% mechanical coverage — gate-definition-done.mjs (EVP2 S4) checks
# coverage independently of this file's status fields, and is expected to report the
# remaining mockups as pending against this same example.

stages:
  D0:
    status: approved
    approved_by: Ledgerline's owner
    date: 2026-08-18
    waivers: []
    decided:
      - Product name and initial owner confirmed at kickoff.
    assumed: []
  D1:
    status: approved
    approved_by: Ledgerline's owner
    date: 2026-08-18
    waivers: []
    decided:
