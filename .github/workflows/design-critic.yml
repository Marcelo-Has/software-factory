          claude_args: '--max-turns 60 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Write,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'

      - name: Classify Pass B's failure as infra or real (F2)
        id: infra-b
        if: always() && steps.claude-b.outcome == 'failure'
        run: |
          log="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$log" ] && grep -qiE 'ETIMEDOUT|ECONNRESET|ENOTFOUND|TLS|SSL|timed out|502|503|504|Service Unavailable|Bad Gateway|Gateway Timeout|overloaded_error' "$log"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "Pass B's failure log matches a distinguishable infra pattern — retrying once."
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "Pass B's failure does not match a known infra pattern — no retry, staying fail-closed."
          fi

      - name: 'Pass B — retry once after an infra failure (F2)'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        id: claude-b-retry
        if: always() && steps.claude-b.outcome == 'failure' && steps.infra-b.outputs.infra == 'true'
        with:
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            You are design-critic. This is a retry of Pass B after an infra failure — same task:
            independent, read-only, post-render visual QA. Read
            `factory/docs/DESIGN-CRITIC-RUBRIC.md`, `project/design/DESIGN.md`, and
            `.claude/rules/design-antipatterns.md` (the [CRITIC] items), in that order. Read
            every screenshot in `artifacts/screenshots/`. Judge the PIXEL — the disk's
            `CLAUDE.md`/`.claude/` and `project/design/DESIGN.md`'s approved sections are
            authoritative per GR-6; confirm any claimed change via `gh pr diff`.

            WRITE the complete verdict to ${{ runner.temp }}/design-critic-verdict-b.md: a title
            `## design-critic — <APPROVED|REJECTED>`, one finding per line
            (`- [High|Med|Low] D<1-7> · <route>@<viewport> — <what's wrong> -> <fix>`), an
            `### Anti-default test` section, and the last line alone: `REJECTED` or `APPROVED`.
            Any High -> REJECTED. Two-plus Med in one dimension -> REJECTED.

            You have 60 turns and ONLY: Read, Glob, Grep, Write, TodoWrite, and Bash restricted
            to ls/git log/git show/gh pr view/gh pr diff. If the budget is running low, write the
            verdict file with what you have.
          claude_args: '--max-turns 60 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Write,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'

      # Discards the credential `claude-code-action` writes to `.git/config` during its own
      # bootstrap. See GR-9 and the longer comment in `review.yml`.
      - name: Discard the .git/config credential after the agent
        if: always()
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # GR-7, applied. One divergence here is expected beyond `review.yml`'s — the PNGs
      # downloaded into `artifacts/`, which `.gitignore` covers — which is exactly why the
      # baseline is taken AFTER restoration and BEFORE the download.
      - name: Check for workspace divergence (GR-7)
        if: always()
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/ws-expected-paths.txt"
          git status --porcelain > "${RUNNER_TEMP}/ws-final.txt"
          echo "::group::Workspace at the end of the job"
          cat "${RUNNER_TEMP}/ws-final.txt"
          echo "::endgroup::"
          # Same PATH-only normalization as the baseline, applied to the final snapshot.
          cut -c4- "${RUNNER_TEMP}/ws-final.txt" | sed -E 's/.* -> //' | sort -u \
            > "${RUNNER_TEMP}/ws-final-paths.txt"
          grep -Fxv -f "${RUNNER_TEMP}/ws-expected-paths.txt" "${RUNNER_TEMP}/ws-final-paths.txt" \
            > "${RUNNER_TEMP}/ws-unexpected.txt" || true
          if [ -s "${RUNNER_TEMP}/ws-unexpected.txt" ]; then
            echo "::warning::The workspace diverged from the commit under critique beyond the config/rubric restoration. The verdict may describe the disk, not the render — see the warning in the PR comment."
          else
            echo "Workspace has no unexpected divergence."
          fi

      # Publishes the verdict AND stands in for the workflow-self-modification guard-rail.
      # Without `Bash(gh pr comment:*)` on the agent, this non-AI step comments, from the file.
      #
      # It covers BOTH rejection paths: the verdict the critic wrote, and the outright rejection
      # `check-visual-evidence.mjs` writes when a screenshot is missing. Both cases produce a
      # file, and both get the PR an explanation.
      - name: Merge the two passes (non-AI step)
        if: always()
        env:
          PASS_A: ${{ runner.temp }}/design-critic-verdict-a.md
          PASS_B: ${{ runner.temp }}/design-critic-verdict-b.md
          VERDICT_FILE: ${{ runner.temp }}/design-critic-verdict.md
        run: node .github/scripts/merge-critic-passes.mjs

      - name: Publish the verdict on the PR (non-AI step)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          F: ${{ runner.temp }}/design-critic-verdict.md
          DIVERGENCE: ${{ runner.temp }}/ws-unexpected.txt
          OUT: ${{ runner.temp }}/design-critic-comment.md
        run: |
          set -euo pipefail
          if [ ! -s "$F" ]; then
            echo "::error::design-critic did not write a verdict to $F. The visual critique did not happen — treat as rejected, not green."
            exit 1
          fi
          if [ -s "$DIVERGENCE" ]; then
            {
              echo "> [!WARNING]"
              echo "> **The runner's workspace diverged from the commit under critique** (GR-7)."
              echo "> These paths diverged beyond the config/rubric restoration ([GR-6]):"
              sed 's/^/> - `/; s/$/`/' "$DIVERGENCE"
              echo ">"
              echo "> The verdict below may describe the DISK, not the render. Check it against"
              echo "> \`gh pr diff ${PR}\` before acting on any finding."
              echo
              cat "$F"
            } > "$OUT"
          else
            cp "$F" "$OUT"
          fi
          # The memory of WHICH commits have already been critiqued. HTML comment: invisible in
          # the rendered body, and `critic-verdict.mjs` reads it back to derive the round instead
          # of incrementing it — what makes the count idempotent and makes two runs of the same
          # commit worth ONE round.
          printf '\n<!-- design-critic:sha=%s -->\n' "${SHA}" >> "$OUT"
          gh pr comment "${PR}" --body-file "$OUT"
          echo "design-critic verdict published on PR #${PR} (commit ${SHA})."

      # The close, and what turns the critic into an actual GATE. This step reads the last line,
      # makes the job RED when it isn't `APPROVED`, and counts the iteration round in a label on
      # the PR itself — `design:round-N`, on the model of the re-entry counter's `reentry:N`.
      # Past the 3-round ceiling, `needs-human` goes on and the PR leaves the automatic queue.
      #
      # AFTER publication, with `if: always()`: the PR needs to go red WITH the explanation
      # already in the thread, not red and mute. And `always()` because the outright rejection
      # for missing evidence is a round too — it fails above, and without this it wouldn't count.
      - name: Close the verdict and count the round (non-AI step)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT_FILE: ${{ runner.temp }}/design-critic-verdict.md
          PR: ${{ github.event.pull_request.number }}
          # Without this the round goes back to being counted by job invocation, and two runs of
          # the same commit spend two rounds of the ceiling (GR-5).
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/critic-verdict.mjs
